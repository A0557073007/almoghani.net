services:
  db:
    image: postgres:16-alpine
    container_name: almoghani-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: almoghani
      POSTGRES_USER: almoghani
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almoghani -d almoghani"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: almoghani-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://almoghani:change-me-local-only@db:5432/almoghani
      CORS_ORIGIN: http://localhost:3000
      DB_POOL_MAX: 10
    ports:
      - "4000:4000"

volumes:
  postgres_data:
