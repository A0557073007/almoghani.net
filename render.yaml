databases:
  - name: almoghani-db
    databaseName: almoghani
    user: almoghani
    plan: free

services:
  - type: web
    name: almoghani-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DB_POOL_MAX
        value: 10
      - key: DATABASE_URL
        fromDatabase:
          name: almoghani-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
