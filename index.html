</audio>
<script>
(function(){
  const audio=document.getElementById('quranAudio');
  let started=false;
  function startAudio(){
    if(started) return;
    audio.volume=0.65;
    const p=audio.play();
    if(p && typeof p.then==='function'){
      p.then(()=>{started=true;cleanup();}).catch(()=>{});
    }
  }
  function cleanup(){
    document.removeEventListener('touchstart',startAudio,true);
    document.removeEventListener('pointerdown',startAudio,true);
    document.removeEventListener('click',startAudio,true);
  }
  document.addEventListener('touchstart',startAudio,true);
  document.addEventListener('pointerdown',startAudio,true);
  document.addEventListener('click',startAudio,true);
})();
</script>

<script>
(function(){
 const ENDPOINT='https://almoghani-ai-production.up.railway.app/api/chat';
 const panel=document.getElementById('aiPanel'), open=document.getElementById('aiOpen'), close=document.getElementById('aiClose');
 const form=document.getElementById('aiForm'), input=document.getElementById('aiInput'), msgs=document.getElementById('aiMessages');
 open.onclick=()=>{panel.classList.add('open');setTimeout(()=>input.focus(),100)};
 close.onclick=()=>panel.classList.remove('open');
 function add(t,c){const d=document.createElement('div');d.className='ai-msg '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
 form.addEventListener('submit',async(e)=>{e.preventDefault();const message=input.value.trim();if(!message)return;add(message,'user');input.value='';input.disabled=true;const wait=add('جاري كتابة الإجابة…','bot');try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const data=await r.json().catch(()=>({}));wait.textContent=data.reply||data.error||'تعذر الحصول على إجابة الآن.'}catch(_){wait.textContent='خدمة ALMOGHANI AI لم تكتمل بعد. حاول مرة أخرى بعد تشغيل الخادم.'}finally{input.disabled=false;input.focus();msgs.scrollTop=msgs.scrollHeight}});
})();
</script>
