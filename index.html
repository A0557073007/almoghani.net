<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ALMOGHANI — قريباً</title>
  <meta name="description" content="موقع almoghani.net قريبًا بإطلالة جديدة.">
  <style>
    :root {
      --bg-1: #05060f;
      --bg-2: #0b1230;
      --card: rgba(255, 255, 255, 0.08);
      --stroke: rgba(255, 255, 255, 0.18);
      --text: #eef2ff;
      --muted: #b8c2ff;
      --primary: #6d7dff;
      --primary-2: #8f6dff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Tajawal", "Cairo", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% 20%, #1a2364 0%, transparent 55%),
        radial-gradient(800px 480px at 85% 80%, #2b1f7a 0%, transparent 58%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(860px, 100%);
      border: 1px solid var(--stroke);
      background: var(--card);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 42px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 86px;
      height: 86px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      font-weight: 800;
      font-size: 30px;
      letter-spacing: 1px;
      margin-bottom: 18px;
      box-shadow: 0 12px 32px rgba(109, 125, 255, 0.45);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1.2;
      letter-spacing: 0.3px;
    }

    p {
      margin: 16px auto 0;
      max-width: 620px;
      color: var(--muted);
      font-size: clamp(16px, 2.5vw, 20px);
      line-height: 1.9;
    }

    .actions {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      text-decoration: none;
      border: 1px solid var(--stroke);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 700;
      transition: 0.2s ease;
      background: rgba(255, 255, 255, 0.06);
    }

    .btn:hover { transform: translateY(-2px); }

    .btn.primary {
      border: 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
    }

    footer {
      margin-top: 26px;
      font-size: 13px;
      color: #a8b2f3;
      opacity: 0.9;
    }

  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="قريباً">
      <div class="logo" aria-hidden="true">A</div>
      <h1>ALMOGHANI</h1>
      <p>
        نعمل حالياً على إطلاق الموقع بحلّة جديدة وتجربة أفضل.
        شكراً لزيارتك — تابعنا قريباً.
      </p>

      <div class="actions">
        <a class="btn primary" href="mailto:hello@almoghani.net">تواصل عبر البريد</a>
      </div>

      <footer>© <span id="year"></span> almoghani.net</footer>
    </section>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
